<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Was "/src/assets/favicon.png" — an absolute dev-only path Vite
         neither hashes nor copies into dist/, so production shipped no
         favicon at all. Files under public/ are served verbatim at the
         site root in both dev and the built image. -->
    <link rel="icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OmniPost</title>
    <!-- Populated at container start from $VITE_API_URL (see docker/entrypoint.sh).
         Lets the same built image be pointed at a different API without a rebuild. -->
    <script src="/config.js"></script>
    <!-- Browser UI (address bar, overscroll) in the page color; kept in
         step with the theme by ThemeProvider. -->
    <meta name="theme-color" content="#EAE3D7" />
    <script>
      // Picks Day or Night before the React bundle loads, so nobody sees a
      // flash of the wrong one: a stored choice wins, otherwise the OS
      // setting. Mirrors the rules in src/components/theme-provider.tsx;
      // keep the two in step.
      (function () {
        var theme = "light";
        try {
          var stored = localStorage.getItem("vite-ui-theme");
          if (stored === "dark" || stored === "light") theme = stored;
          else if (window.matchMedia("(prefers-color-scheme: dark)").matches) theme = "dark";
        } catch (e) {}
        document.documentElement.classList.add(theme);
        if (theme === "dark") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#14110D");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
