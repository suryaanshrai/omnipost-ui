server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: client-side routes (react-router) all resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the runtime config; it's regenerated per-container-start.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
